name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neural: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -c requirements-lock.txt -e '.[dev]'
      - if: matrix.neural
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -c requirements-lock.txt -r requirements-llm.txt
      - run: make check test
      - run: python release/check.py
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach garden
      - run: python3 scripts/check_server.py --timeout 300
      - run: docker compose exec -T garden python scripts/flytalk/smoke_test.py --workers 1
      - run: docker compose --profile neural build neural-link
      - run: >-
          docker compose --profile neural run --rm --no-deps neural-link
          python -c "from flypet.neural_records import verify_bundle;
          from flypet.latent_inference import LatentModels;
          print(verify_bundle('output/neural-link')['revision'])"
      - if: always()
        run: |
          docker compose logs --no-color
          docker compose down --volumes
